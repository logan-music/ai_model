name: Universal Model Training

# Runs weekly + manual trigger
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Show Python & pip versions
        run: |
          python -V
          pip -V

      # 🔥 NEW STEP: Download dataset from Render
      - name: Download latest dataset from Render
        run: |
          echo "Downloading universal_features.csv from Render..."
          curl -L https://YOUR-APP.onrender.com/download -o universal_features.csv
          
          if [ ! -f universal_features.csv ]; then
            echo "❌ Download failed!"
            exit 1
          fi
          
          echo "✅ universal_features.csv downloaded successfully."
          ls -lh universal_features.csv

      - name: Run training pipeline (non-interactive)
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME || 'Model Trainer' }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL || 'trainer@example.com' }}
          AUTO_APPROVE: 'true'
        run: |
          set -euo pipefail
          echo "Starting training pipeline..."
          python main.py --skip-collection --push

      - name: Upload model artifacts (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-model-artifacts
          path: |
            universal_model.pkl
            universal_scalp_model.pkl
            universal_scalp_scaler.pkl
            universal_features.pkl
          if-no-files-found: warn

      - name: Success marker
        if: success()
        run: echo "✅ Training workflow completed successfully."

      - name: Fail marker
        if: failure()
        run: echo "❌ Training workflow finished with errors. Check logs above."
